<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zalogowani użytkownicy – Node 622155, 65318, 66881</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222;
      transition: background 0.3s, color 0.3s;
    }

    #topbar {
      background: #0f8a1f;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
    }

    #clock {
      font-size: 18px;
      font-weight: bold;
    }

    #themeToggle, #mapToggle {
      font-size: 22px;
      cursor: pointer;
      padding: 5px 10px;
      user-select: none;
      margin-left: 10px;
    }

    #content {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h2 {
      margin-top: 10px;
      font-size: 26px;
      font-weight: 600;
      border-bottom: 2px solid #eee;
      padding-bottom: 8px;
      text-align: center;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: center;
    }

    th {
      background: #f5f5f5;
      font-weight: 600;
    }

    .aprs-icon {
      width: 22px;
      cursor: pointer;
      margin: 2px;
    }

    #footer {
      margin-top: 40px;
      padding: 20px;
      text-align: center;
      color: #666;
      font-size: 14px;
      border-top: 1px solid #eee;
    }

    #networkMap {
      text-align: center;
      margin-top: 40px;
    }

    #networkMap img {
      max-width: 100%;
      border: 1px solid #ccc;
      padding: 10px;
      background: #fafafa;
    }

    /* ⭐ Tryb ciemny */
    body.dark {
      background: #1e1e1e;
      color: #e6e6e6;
    }

    body.dark #topbar {
      background: #0a5f15;
    }

    body.dark table th {
      background: #333;
      color: #fff;
    }

    body.dark table td {
      border-color: #555;
    }

    body.dark #footer {
      border-top: 1px solid #444;
      color: #aaa;
    }

    body.dark #networkMap img {
      background: #2a2a2a;
      border-color: #555;
    }

    /* ⭐ Linki w trybie ciemnym */
    body.dark a {
      color: #7ab8ff;
      text-decoration: none;
    }

    body.dark a:hover {
      color: #a8d4ff;
      text-decoration: underline;
    }

    body.dark #mapToggle {
      color: #cce3ff;
    }

    /* ⭐ Odwrócenie kolorów ikony APRS w trybie ciemnym */
    body.dark .aprs-icon {
      filter: invert(1);
    }

    /* ⭐ Odwrócenie kolorów mapy w trybie ciemnym */
    body.dark #mapImage {
      filter: invert(1);
    }

  </style>
</head>

<body>

<div id="topbar">
  <div id="clock"></div>
  <div style="display:flex;align-items:center;">
    <div id="themeToggle" title="Zmień tryb">🌞</div>
    <div id="mapToggle" title="Pokaż/Ukryj mapę">🗺️</div>
  </div>
</div>

<div id="content">

<h2>Zalogowani użytkownicy – Node 622155, 65318, 66881</h2>

<table id="users">
  <thead>
    <tr>
      <th>Znak</th>
      <th>Node</th>
      <th>Lokalizacja</th>
      <th>Węzeł</th>
      <th>APRS</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div id="networkMap">
  <h3>Mapa połączeń AllStarLink</h3>
  <img id="mapImage"
       src="https://stats.allstarlink.org/stats/66881/networkMap"
       alt="Network Map 66881">
</div>

</div>

<div id="footer">
 <img alt="Static Badge" src="https://img.shields.io/badge/2026_SP1RAC_v.1.3-green?logo=unlicense">
</div>

<script>
  // ⭐ Zegar UTC
  function updateClock() {
    const now = new Date();
    const date = now.toLocaleDateString("pl-PL", { timeZone: "UTC" });
    const time = now.toLocaleTimeString("pl-PL", { timeZone: "UTC", hour12: false });
    document.getElementById("clock").textContent = `${date} ${time} UTC`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ⭐ Tryb jasny / ciemny
  const themeToggle = document.getElementById("themeToggle");

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
    themeToggle.textContent = "🌙";
  }

  themeToggle.onclick = () => {
    document.body.classList.toggle("dark");
    if (document.body.classList.contains("dark")) {
      themeToggle.textContent = "🌙";
      localStorage.setItem("theme", "dark");
    } else {
      themeToggle.textContent = "🌞";
      localStorage.setItem("theme", "light");
    }
  };

  // ⭐ Ukrywanie / pokazywanie mapy
  const mapToggle = document.getElementById("mapToggle");
  const mapBox = document.getElementById("networkMap");

  if (localStorage.getItem("mapVisible") === "false") {
    mapBox.style.display = "none";
    mapToggle.textContent = "🗺️❌";
  }

  mapToggle.onclick = () => {
    if (mapBox.style.display === "none") {
      mapBox.style.display = "block";
      mapToggle.textContent = "🗺️";
      localStorage.setItem("mapVisible", "true");
    } else {
      mapBox.style.display = "none";
      mapToggle.textContent = "🗺️❌";
      localStorage.setItem("mapVisible", "false");
    }
  };

  // ⭐ Odświeżanie mapy
  function refreshMap() {
    const img = document.getElementById("mapImage");
    img.src = "https://stats.allstarlink.org/stats/66881/networkMap?ts=" + Date.now();
  }

  // ⭐ Pobieranie danych z API AllStarLink
  const nodes = [
    { url: "https://stats.allstarlink.org/api/stats/66881", id: 66881 },
    { url: "https://stats.allstarlink.org/api/stats/65318", id: 65318 },
     { url: "https://stats.allstarlink.org/api/stats/622155", id: 622155 }
  ];

  const tbodyUsers = document.querySelector("#users tbody");

  async function loadData() {
    const allEntries = [];

    for (const node of nodes) {
      try {
        const res = await fetch(node.url);
        const data = await res.json();

        const linked = data?.stats?.data?.linkedNodes || [];

        linked.forEach(entry => {
          const userId = entry.User_ID ?? "–";
          const name = entry.name ?? "–";
          const location = entry.server?.Location ?? "–";

          allEntries.push({
            userId,
            name,
            location,
            node: node.id
          });
        });

      } catch (err) {
        console.error("Błąd pobierania danych:", err);
      }
    }

    allEntries.sort((a, b) =>
      String(a.userId).localeCompare(String(b.userId), undefined, { numeric: true })
    );

    tbodyUsers.innerHTML = "";

    const groups = {};
    allEntries.forEach(item => {
      if (!groups[item.userId]) groups[item.userId] = [];
      groups[item.userId].push(item);
    });

    for (const userId in groups) {
      const rows = groups[userId];
      const rowspan = rows.length;

      rows.forEach((item, index) => {
        const tr = document.createElement("tr");

        if (index === 0) {
          const tdUser = document.createElement("td");
          tdUser.rowSpan = rowspan;

          if (userId !== "–") {
            const a = document.createElement("a");
            a.href = "https://www.qrz.com/db/" + encodeURIComponent(userId);
            a.target = "_blank";
            a.textContent = userId;
            tdUser.appendChild(a);
          } else {
            tdUser.textContent = "–";
          }

          tr.appendChild(tdUser);
        }

        const tdName = document.createElement("td");
        tdName.textContent = item.name;

        const tdLocation = document.createElement("td");
        tdLocation.textContent = item.location;

        const tdNode = document.createElement("td");
        tdNode.textContent = item.node;

        tr.appendChild(tdName);
        tr.appendChild(tdLocation);
        tr.appendChild(tdNode);

        if (index === 0) {
          const tdAprs = document.createElement("td");
          tdAprs.rowSpan = rowspan;

          if (userId !== "–") {
            const sat = document.createElement("img");
            sat.src = "https://ref032.dstar.radom.pl/img/sat.png";
            sat.className = "aprs-icon";
            sat.title = "APRS.fi";
            sat.onclick = () => {
              window.open("https://aprs.fi/" + encodeURIComponent(userId), "_blank");
            };
            tdAprs.appendChild(sat);
          } else {
            tdAprs.textContent = "–";
          }

          tr.appendChild(tdAprs);
        }

        tbodyUsers.appendChild(tr);
      });
    }
  }

  loadData();
  refreshMap();
  setInterval(() => {
    loadData();
    refreshMap();
  }, 60000);
</script>

</body>
</html>
